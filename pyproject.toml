[build-system]
requires = [
    "setuptools>=64"
]
build-backend = "setuptools.build_meta"

[project]
name = "rich-rst"
version = "2.1.0"
description = "A beautiful reStructuredText renderer for rich"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "rich_rst/_vendor/LICENSES.txt"]
authors = [
    { name = "Wasi Master", email = "arianmollik323@gmail.com" }
]
keywords = ["rich", "rst", "restructuredtext", "terminal", "docutils", "renderer"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English"
]
dependencies = [
    "rich>=12.0.0",
    "pygments>=2.0.0"
]

[project.urls]
"Bug Tracker" = "https://github.com/wasi-master/rich-rst/issues"
"Source" = "https://github.com/wasi-master/rich-rst"
"Documentation" = "https://rich-rst.readthedocs.io/en/latest/"
"Say Thanks" = "https://saythanks.io/to/wasi-master"
"Homepage" = "https://wasi-master.github.io/rich-rst"

[project.optional-dependencies]
docs = [
    "docutils",
    "sphinx",
    "sphinx_copybutton",
    "sphinx_rtd_theme"
]
tests = [
    "pytest",
    "pytest-cov"
]
dev = [
    "ruff",
    "mypy",
    "pre-commit"
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["rich_rst*"]

[tool.coverage.run]
omit = [
    "rich_rst/_vendor/*",
]
[tool.coverage.report]
omit = [
    "rich_rst/_vendor/*",
    "tests/*",
]

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = [
    "rich_rst/_vendor",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "YTT", "ASYNC", "ASYNC1", "C4", "RUF"]
ignore = [
    "E501",    # Line too long (handled by formatter or required for long literal rst strings)
    "RUF001",  # Ambiguous unicode character in string (required for testing unicode characters/box symbols)
    "RUF002",  # Ambiguous unicode character in docstring (required for doc examples)
    "RUF003",  # Ambiguous unicode character in comment (required for documentation/diagram comments)
    "RUF012",  # Mutable class default (docutils Directive style requires mutable dicts)
]

[tool.ruff.lint.per-file-ignores]
"rich_rst/__init__.py" = [
    "N801",    # Invalid class name (docutils Node subclass naming style)
    "N802",    # Invalid function name (visitor methods match docutils node class names)
    "N806",    # Non-lowercase variable in function (table/box border constants TL, TH, etc.)
    "N816",    # Mixed-case variable in global scope (backwards compatible public aliases)
]
"tests/conftest.py" = [
    "E402",    # Module level import not at top of file (sys.path manipulation is required here)
]
"tools/generate_demo_page.py" = [
    "E402",    # Module level import not at top of file
    "N806",    # Non-lowercase variable in function
]
"tools/vendor_docutils.py" = [
    "N806",    # Non-lowercase variable in function
]

[tool.ruff.format]
quote-style = "single"
exclude = ["rich_rst/__init__.py"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["rich_rst/_vendor"]

[[tool.mypy.overrides]]
module = "rich_rst._vendor.*"
ignore_errors = true

