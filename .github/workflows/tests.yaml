name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        backend: ["rich", "fast-rich"]
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
      RICH_RST_USE_FAST_RICH: ${{ matrix.backend == 'fast-rich' && '1' || '0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install library (rich)
        if: matrix.backend == 'rich'
        run: |
          pip install -e .
          pip install pytest pytest-coverage

      - name: Install library (fast-rich)
        if: matrix.backend == 'fast-rich'
        run: |
          pip install -e ".[speed]"
          pip install pytest pytest-coverage

      - name: Run tests
        run: |
          python -m pytest --cov=rich_rst --cov-report term --cov-report xml --junitxml=testresults.xml
          coverage report
