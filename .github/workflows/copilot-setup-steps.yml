name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be named `copilot-setup-steps`.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Persist the repository state (built docs, installed deps) into the agent snapshot
    snapshot: true
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install test and docs dependencies
        run: |
          python -m pip install -e "[tests]"
          if [ -f docs/requirements.txt ]; then
            python -m pip install -r docs/requirements.txt
          fi

      - name: Build Sphinx docs
        run: |
          # Build HTML for docs. The agent can serve docs/_build/html for live preview.
          if [ -f docs/Makefile ]; then
            make -C docs html
          else
            python -m sphinx -b html docs/source docs/_build/html
          fi

      - name: Verify built docs
        run: |
          if [ -d docs/_build/html ]; then
            echo "Docs built: $(ls -1 docs/_build/html | head -n 5)"
          else
            echo "Docs build failed" && false
          fi

      - name: Note: how to preview docs (read-only step)
        run: |
          echo "To preview built docs in a Copilot session run:"
          echo "  python -m http.server --directory docs/_build/html 8000"
          echo "To run tests: python -m pytest tests/ or a specific test: python -m pytest tests/test_api.py::test_name"
